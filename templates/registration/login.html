<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Compras Mensais</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #999999; 
            margin: 0; 
            padding: 0; 
            color: #222; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container { 
            width: 90%; 
            max-width: 400px; 
            background: #888888; 
            padding: 24px; 
            border-radius: 10px; 
            box-shadow: 0 2px 12px rgba(0,0,0,.08); 
        }
        h1 { margin-top: 0; text-align: center; color: #222; }
        .form-control { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 16px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        .btn { 
            display: block; 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: none; 
            cursor: pointer; 
            font-size: 16px; 
            margin-bottom: 10px;
        }
        .btn-primary { background: #0b57d0; color: white; }
        .btn-primary:hover { background: #0a4cad; }
        .erro { color: #c62828; margin-bottom: 16px; text-align: center; }
        .info { color: #666; font-size: 14px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Compras Mensais</h1>
        
        {% if form.errors %}
            <div class="erro">
                Usuário ou senha incorretos. Tente novamente.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <label for="{{ form.username.id_for_label }}">Usuário:</label>
            <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" 
                   class="form-control" placeholder="Digite seu usuário" required autofocus>
            
            <label for="{{ form.password.id_for_label }}">Senha:</label>
            <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" 
                   class="form-control" placeholder="Digite sua senha" required>
            
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        
        <div class="info">
            Sessão expira em 1 minuto de inatividade
        </div>
    </div>
</body>
</html>
